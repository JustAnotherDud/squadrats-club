name: fetch-map-data

# Lê os vector tiles do Squadrats, gera os JSON e publica-os na branch `data`
# só quando mudam. O site e o folha-do-clube lêem-nos por raw.githubusercontent,
# por isso o main só recebe código e stubs.
# Horário: 6 corridas por dia, ao minuto 7 para fugir ao pico do scheduler. A
# última é às 20h07 UTC porque o GitHub atrasa as corridas 2 a 3 h e o dia dos
# ganhos é a data UTC do arranque. Não subir a frequência sem refazer as contas
# de pedidos ao Squadrats (README, "usage rules").
on:
  schedule:
    - cron: "7 1,5,9,13,17,20 * * *"
  workflow_dispatch: {}

concurrency:
  group: squadrats-data-push
  cancel-in-progress: false

env:
  # ficheiros que o pipeline regenera; o resto de data/ é estático e vive no main
  FILES: "data/tile_info_squadrats.json data/tile_info_squadratinhos.json data/stats.json data/squadrats.json data/trophies.json data/suggestions.json data/club.json data/club_regioes.json data/daily_gains.json data/gains_regioes.json data/regioes_index.json data/scan_cache.json data/events.json data/ganhos.json"
  # um JSON por atleta (build_profiles.py) e por lugar (append_regioes.py)
  PROFILES_DIR: "data/atletas"
  REGIOES_DIR: "data/regioes"

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Carregar o estado mais recente da branch 'data'
        run: |
          # identidade dos commits do bot, para todos os passos (e o worktree)
          git config user.name "squadrats-bot"
          git config user.email "actions@users.noreply.github.com"
          # parte do último estado publicado (cache de cobertura, base dos
          # ganhos). Histórico completo: o append_ganhos recalcula tudo desde o início
          git fetch origin data
          git checkout origin/data -- $FILES "$PROFILES_DIR" "$REGIOES_DIR"

      # um passo só: os consumidores partilham o varrimento de cada atleta
      - name: Varrer e gerar tudo (mapa detalhado + totais do clube + club)
        env:
          # {nome: UID Firebase}; a ordem fixa os bits do club.json
          ATHLETES_JSON: ${{ secrets.ATHLETES_JSON }}
        run: python3 pipeline/run_all.py data

      - name: Publicar na branch 'data' só se houver diferença real
        run: |
          # o passo de carregar deixou o índice no último estado publicado
          if git diff --quiet -- $FILES "$PROFILES_DIR" "$REGIOES_DIR"; then
            echo "sem alterações reais, nada a publicar."
            exit 0
          fi

          # worktree à parte: o checkout principal nunca troca de branch
          git worktree add -B data /tmp/data-branch origin/data
          for f in $FILES; do
            mkdir -p "/tmp/data-branch/$(dirname "$f")"
            cp "$f" "/tmp/data-branch/$f"
          done
          # substitui as pastas inteiras, para um ficheiro apagado aqui
          # desaparecer também na branch
          for D in "$PROFILES_DIR" "$REGIOES_DIR"; do
            rm -rf "/tmp/data-branch/$D"
            if [ -d "$D" ]; then
              mkdir -p "/tmp/data-branch/$D"
              cp "$D"/*.json "/tmp/data-branch/$D/"
            fi
          done

          cd /tmp/data-branch
          git add $FILES
          git add -A "$PROFILES_DIR" "$REGIOES_DIR"
          git commit -m "chore(data): atualizar squares via vector tiles [skip ci]"
          git push origin data

      # Os stubs vivem no main (o Pages serve de lá) e só mudam quando entra
      # ou sai um atleta ou um lugar. `--only`: o passo de carregar deixou os
      # dados staged no índice do main e não podem ir para lá.
      - name: Regenerar stubs dos perfis (só commita se o conjunto de atletas mudou)
        if: always()
        continue-on-error: true
        env:
          ATHLETES_JSON: ${{ secrets.ATHLETES_JSON }}
        run: |
          python3 pipeline/gen_profile_stubs.py

          git add atletas/
          if git diff --cached --quiet -- atletas/; then
            echo "stubs dos perfis sem alterações, nada a commitar."
            exit 0
          fi
          git commit --only atletas/ -m "chore: regenerar stubs dos perfis [skip ci]"
          git push origin HEAD:main

      - name: Regenerar stubs dos lugares (só commita se a lista mudou)
        if: always()
        continue-on-error: true
        run: |
          python3 pipeline/gen_lugar_stubs.py

          git add lugares/
          if git diff --cached --quiet -- lugares/; then
            echo "stubs dos lugares sem alterações, nada a commitar."
            exit 0
          fi
          git commit --only lugares/ -m "chore: regenerar stubs dos lugares [skip ci]"
          git push origin HEAD:main

      # O GitHub desliga o schedule de um repo público sem actividade há 60
      # dias. Commit ao main se o último tiver mais de 25 dias. `--only`: ver
      # os stubs acima.
      - name: Heartbeat (mantém o schedule do Actions ativo)
        if: always()
        continue-on-error: true
        run: |
          dias=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$dias" -lt 25 ]; then
            echo "último commit ao main há $dias dias, schedule seguro, nada a fazer."
            exit 0
          fi

          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git commit --only heartbeat.txt -m "chore: heartbeat (mantém o schedule do Actions ativo) [skip ci]"
          git push origin HEAD:main
